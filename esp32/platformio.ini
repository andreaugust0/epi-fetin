; Firmware da catraca — ESP32 DevKit V1 (WROOM-32).
;
;   pio run -t upload        grava
;   pio device monitor       acompanha o log
;
; Antes do primeiro build, copie `src/config.exemplo.h` para `src/config.h`
; e preencha a rede e o IP do servidor. O `config.h` é ignorado pelo git de
; propósito: senha de Wi-Fi não vai para repositório.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; O ESP32 reinicia ao abrir a serial. Sem isto, as primeiras linhas do boot —
; que são justamente as que dizem por que ele não conectou — se perdem.
monitor_rts = 0
monitor_dtr = 0

lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0

build_flags =
	; O padrão do PubSubClient é 256 bytes, e ele DESCARTA em silêncio o que
	; passa disso — sem erro, sem log, a mensagem simplesmente não chega ao
	; callback. O `cmd/liberar` cabe folgado, mas um campo novo no envelope
	; estouraria o limite e o sintoma seria "a catraca parou de abrir".
	-D MQTT_MAX_PACKET_SIZE=1024
	-D MQTT_KEEPALIVE=30
