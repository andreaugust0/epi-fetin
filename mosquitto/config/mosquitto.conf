# ---------------------------------------------------------------------------
# Mosquitto — configuração de DESENVOLVIMENTO
#
# Anônimo e sem TLS: bom para você conseguir depurar com mosquitto_sub sem
# atrito. NÃO leve isto para a bancada final nem para a defesa: as duas
# seções comentadas no fim mostram como travar, e mostrar o broker travado
# é meio ponto fácil.
# ---------------------------------------------------------------------------

listener 1883 0.0.0.0
allow_anonymous true

# WebSocket: permite espiar o tráfego MQTT de dentro do navegador, útil
# quando você estiver construindo a interface do tablet.
listener 9001 0.0.0.0
protocol websockets

# Persistência das sessões. É o que faz `clean_session=False` valer alguma
# coisa: com isto, mensagens QoS 1 publicadas enquanto o worker estava fora
# do ar são entregues quando ele volta, em vez de se perderem.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Limites — evitam que um cliente com defeito derrube o broker.
max_queued_messages 1000
message_size_limit 262144


# ---------------------------------------------------------------------------
# PRODUÇÃO — descomente e ajuste
# ---------------------------------------------------------------------------
#
# 1) TLS na 8883. Sem isto, a senha de cada dispositivo trafega em texto
#    puro na rede da empresa.
#
# listener 8883 0.0.0.0
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# require_certificate false
# tls_version tlsv1.2
#
# 2) Autenticação e ACL. Um usuário POR DISPOSITIVO, nunca compartilhado:
#    se um ESP32 for extraviado, você revoga só aquela credencial.
#
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
#
#    Criar as senhas:
#      docker compose exec broker mosquitto_passwd -c /mosquitto/config/passwd backend
#      docker compose exec broker mosquitto_passwd /mosquitto/config/passwd rasp-planta01-portaria
#      docker compose exec broker mosquitto_passwd /mosquitto/config/passwd esp32-planta01-portaria
#
#    O arquivo acl (modelo em mosquitto/config/acl.exemplo) é o que impede
#    um ESP32 comprometido de publicar resultado de EPI falso — ou de
#    assinar o comando de liberação de OUTRA catraca.
